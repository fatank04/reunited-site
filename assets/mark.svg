<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" role="img" aria-label="Reunited">
  <title>Reunited</title>
  <!-- Two lives that overlap. Inherits colour from context, so one file
       serves the ember masthead, an ink footer and a reversed dark ground. -->
  <g fill="none" stroke="currentColor" stroke-width="2.6">
    <circle cx="24" cy="20" r="15"/>
    <circle cx="40" cy="20" r="15"/>
  </g>
</svg>
