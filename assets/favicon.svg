<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rings only, no serif r. At 16px the letter inside the rings turns to
       mush; the two overlapping circles stay legible and are the distinctive
       half of the mark. Dawn ground so it reads on dark and light tab bars. -->
  <rect width="64" height="64" rx="14" fill="#FFF6EC"/>
  <g fill="none" stroke="#A85E2C" stroke-width="4.5">
    <circle cx="26" cy="32" r="14"/>
    <circle cx="38" cy="32" r="14"/>
  </g>
</svg>
